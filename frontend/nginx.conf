# Serves the built SPA and proxies /api to the Django service (docker-compose name "api").
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Container liveness, answered by nginx itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API traffic. The browser's Host header is forwarded so DRF builds pagination
    # links the browser can follow (http://localhost:8201/api/v1/...).
    location /api/ {
        proxy_pass http://api:8200;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build output can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /brand/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback: every other path is a client route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
