name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: talentos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U test -d talentos_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://test:isolated-ci-password@127.0.0.1:5432/talentos_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend && ruff format --check backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: lint-imports && pytest -q
        working-directory: backend
      - run: pip-audit -r backend/requirements.lock --require-hashes
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      - run: npm audit --audit-level=high
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.57.1
      - run: cfn-lint infra/aws/stack.json
