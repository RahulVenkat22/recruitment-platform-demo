###############################################################################
# Aimious AI Recruitment Platform -- full stack
#
#   postgres  ->  host 5434  (container 5432)   PostgreSQL 16 + pgvector
#   api       ->  host 8200                     Django + DRF
#   web       ->  host 8201  (container 80)     nginx serving the Vite build,
#                                               proxying /api -> api
#
# Ports 5433, 8000, 8080, 8100, 8101 and 5174 belong to other projects on this
# machine and are deliberately avoided (see plan.md section 5.1).
#
#   docker compose up -d postgres     database only (local dev with the venv)
#   docker compose up -d --build      start everything (make docker-up)
#   docker compose logs -f api web    follow the app containers
#   docker compose down               stop (add -v to drop the data volume)
###############################################################################

name: aimious-recruit

services:
  postgres:
    # The official PostgreSQL 16 image plus the pgvector extension (resume
    # embeddings). Same data volume and credentials as before; the extension
    # itself is created by the resumes app's first migration.
    image: pgvector/pgvector:pg16
    container_name: aimious-recruit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruit
      POSTGRES_PASSWORD: recruit
      POSTGRES_DB: recruitment_demo
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruit -d recruitment_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aimious-recruit-api:latest
    container_name: aimious-recruit-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Optional: any value in .env (copied from .env.example) is picked up here.
    # `environment:` below always wins, so a host-oriented DATABASE_URL in .env
    # cannot break the container networking.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network Postgres is reachable by SERVICE NAME on its
      # native port -- never localhost:5434, which is the host-side mapping.
      DATABASE_URL: postgres://recruit:recruit@postgres:5432/recruitment_demo
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      # nginx forwards the browser's Host header (localhost / 127.0.0.1); `api`
      # covers direct container-to-container calls. Add a LAN IP or hostname
      # here if the demo is opened from another machine.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8201,http://127.0.0.1:8201}
    ports:
      - "8200:8200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if 200 <= urllib.request.urlopen('http://127.0.0.1:8200/api/v1/health/', timeout=5).status < 300 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty -> the bundle calls /api/v1/... on its own origin and nginx
        # proxies it to the api service.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: aimious-recruit-web:latest
    container_name: aimious-recruit-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8201:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
